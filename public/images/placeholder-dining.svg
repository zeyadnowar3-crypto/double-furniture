<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141c24"/>
      <stop offset="100%" stop-color="#0b0f14"/>
    </linearGradient>
    <linearGradient id="marble" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgd)"/>
  <ellipse cx="400" cy="430" rx="320" ry="25" fill="#1e293b"/>
  <!-- Chairs Back -->
  <rect x="180" y="200" width="45" height="110" rx="6" fill="#334155"/>
  <rect x="250" y="200" width="45" height="110" rx="6" fill="#334155"/>
  <rect x="505" y="200" width="45" height="110" rx="6" fill="#334155"/>
  <rect x="575" y="200" width="45" height="110" rx="6" fill="#334155"/>
  <!-- Dining Table Top -->
  <rect x="150" y="270" width="500" height="40" rx="8" fill="url(#marble)" stroke="#94a3b8" stroke-width="2"/>
  <!-- Table Legs -->
  <rect x="230" y="310" width="24" height="100" fill="#0f172a"/>
  <rect x="546" y="310" width="24" height="100" fill="#0f172a"/>
  <!-- Chairs Front -->
  <rect x="320" y="290" width="55" height="90" rx="8" fill="#475569"/>
  <rect x="425" y="290" width="55" height="90" rx="8" fill="#475569"/>
  <text x="400" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">سفرة مودرن ألترا 8 كراسي</text>
  <text x="400" y="115" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">ترابيزة 2.20م رخام إسباني مستورد • شاسيه زان أحمر</text>
</svg>