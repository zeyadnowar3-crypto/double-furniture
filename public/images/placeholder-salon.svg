<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1f1d"/>
      <stop offset="100%" stop-color="#140c0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)"/>
  <ellipse cx="400" cy="420" rx="300" ry="25" fill="#2d1c1a"/>
  <!-- Classic Crown Back -->
  <path d="M 230 330 C 230 180, 310 140, 400 170 C 490 140, 570 180, 570 330 Z" fill="#78350f" stroke="url(#gold)" stroke-width="8"/>
  <rect x="250" y="270" width="300" height="70" rx="14" fill="#991b1b"/>
  <!-- Gold carved legs -->
  <rect x="260" y="340" width="16" height="40" rx="4" fill="url(#gold)"/>
  <rect x="524" y="340" width="16" height="40" rx="4" fill="url(#gold)"/>
  <text x="400" y="90" fill="#fef08a" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">صالون كوين إمبريال كلاسيك مذهب</text>
  <text x="400" y="125" fill="#fde68a" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">أويما يدوي زان أحمر • ورق ذهب إيطالي • حرير دمكس</text>
</svg>