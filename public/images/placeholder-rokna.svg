<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#0f131a"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Floor line -->
  <line x1="80" y1="410" x2="720" y2="410" stroke="#334155" stroke-width="4"/>
  <!-- Rug -->
  <ellipse cx="400" cy="415" rx="280" ry="25" fill="#1e293b"/>
  <!-- Sofa Back -->
  <rect x="180" y="210" width="440" height="130" rx="20" fill="url(#sofa)"/>
  <!-- Left Chaise (L-shape) -->
  <rect x="180" y="260" width="140" height="120" rx="16" fill="url(#sofa)"/>
  <rect x="190" y="270" width="120" height="90" rx="10" fill="url(#cushion)"/>
  <!-- Sofa Main Cushion -->
  <rect x="330" y="280" width="280" height="70" rx="14" fill="url(#cushion)"/>
  <!-- Back Cushions -->
  <rect x="340" y="225" width="80" height="50" rx="8" fill="#fde68a" opacity="0.9"/>
  <rect x="430" y="225" width="80" height="50" rx="8" fill="#fde68a" opacity="0.9"/>
  <rect x="520" y="225" width="80" height="50" rx="8" fill="#fde68a" opacity="0.9"/>
  <!-- Arms -->
  <rect x="160" y="240" width="40" height="110" rx="12" fill="#92400e"/>
  <rect x="600" y="240" width="40" height="110" rx="12" fill="#92400e"/>
  <!-- Modern Table -->
  <ellipse cx="400" cy="390" rx="70" ry="18" fill="#f8fafc" opacity="0.85"/>
  <rect x="395" y="390" width="10" height="25" fill="#64748b"/>
  <!-- Text Label -->
  <text x="400" y="90" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">ركنة مودرن فاخرة (L-Shape)</text>
  <text x="400" y="125" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">خشب زان أحمر • إسفنج 36 سوفت • قماش مستورد</text>
</svg>