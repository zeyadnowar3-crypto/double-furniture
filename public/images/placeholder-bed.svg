<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1e24"/>
      <stop offset="100%" stop-color="#121216"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgb)"/>
  <!-- Headboard -->
  <rect x="180" y="160" width="440" height="150" rx="14" fill="#3f3f46" stroke="#e4e4e7" stroke-width="2"/>
  <!-- Tufting lines -->
  <line x1="260" y1="160" x2="260" y2="310" stroke="#27272a" stroke-width="3"/>
  <line x1="350" y1="160" x2="350" y2="310" stroke="#27272a" stroke-width="3"/>
  <line x1="440" y1="160" x2="440" y2="310" stroke="#27272a" stroke-width="3"/>
  <line x1="530" y1="160" x2="530" y2="310" stroke="#27272a" stroke-width="3"/>
  <!-- Mattress / Bed Base -->
  <rect x="200" y="270" width="400" height="90" rx="12" fill="#fafafa"/>
  <rect x="200" y="300" width="400" height="60" rx="8" fill="#a1a1aa"/>
  <!-- Pillows -->
  <rect x="230" y="240" width="120" height="50" rx="10" fill="#e4e4e7"/>
  <rect x="450" y="240" width="120" height="50" rx="10" fill="#e4e4e7"/>
  <!-- Nightstands -->
  <rect x="90" y="260" width="70" height="80" rx="8" fill="#52525b"/>
  <rect x="640" y="260" width="70" height="80" rx="8" fill="#52525b"/>
  <text x="400" y="80" fill="#f4f4f5" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" text-anchor="middle">غرفة نوم ماستر رويال مودرن</text>
  <text x="400" y="115" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="16" text-anchor="middle">سرير 180سم كابوتينيه + دولاب جرار 2.80م إضاءة ليد مخفية</text>
</svg>